name: Build

on:
  push:
    branches: [ master, devel ]
    tags: [ '*.*.*' ]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # 'false' when the secret is not readable (pull requests from forks) : Windows build without SimConnect
      HAS_SDK_KEY: ${{ secrets.SIMCONNECT_SDK_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # with SimConnect (MSFS 2024 SDK from the private repository ffs2play-sdk) : release installer
          - name: Windows MSVC
            os: windows-2022
            preset: windows-msvc
            build_preset: windows-msvc-release
            package: true
            artifact: release-windows
          - name: Linux
            os: ubuntu-24.04
            preset: linux-release
            build_preset: linux-release
            package: false
            artifact: ''
          - name: macOS
            os: macos-14
            preset: macos-release
            build_preset: macos-release
            package: true
            artifact: release-macos

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # tags give the application version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtgrpc         # Qt Protobuf
          cache: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libgl1-mesa-dev libxkbcommon-dev

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      # The MSFS SDK license forbids publishing it : private repository, read-only deploy key (suite sheet 0006)
      - name: SimConnect SDK
        if: runner.os == 'Windows' && env.HAS_SDK_KEY == 'true'
        uses: actions/checkout@v5
        with:
          repository: Artemia76/ffs2play-sdk
          ssh-key: ${{ secrets.SIMCONNECT_SDK_KEY }}
          persist-credentials: false
          path: simconnect-sdk

      - name: Configure
        shell: bash
        env:
          QTDIR: ${{ env.QT_ROOT_DIR }}
        run: |
          simconnect=()
          if [ "$RUNNER_OS" = Windows ]; then
            if [ -f "simconnect-sdk/SimConnect SDK/include/SimConnect.h" ]; then
              simconnect=(-DFFS2PLAY_WITH_SIMCONNECT=ON "-DSIMCONNECT_PATH=$(cygpath -m "$PWD/simconnect-sdk/SimConnect SDK")")
            elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error title=SimConnect::secret SIMCONNECT_SDK_KEY missing : no release installer without SimConnect"
              exit 1
            else
              echo "::warning title=SimConnect::secret SIMCONNECT_SDK_KEY not readable : build without SimConnect"
              simconnect=(-DFFS2PLAY_WITH_SIMCONNECT=OFF)
            fi
          fi
          cmake --preset ${{ matrix.preset }} "${simconnect[@]}" 2>&1 | tee configure.log
          rc=${PIPESTATUS[0]}
          # a release installer must have SimConnect with the MSFS 2024 API
          if [ $rc -eq 0 ] && [ "$RUNNER_OS" = Windows ] && [[ "$GITHUB_REF" == refs/tags/* ]] &&
             grep -q -E "SimConnect SDK not found|SimConnect SDK without MSFS 2024 API" configure.log; then
            echo "::error title=SimConnect::release installer without SimConnect or without the MSFS 2024 API"
            exit 1
          fi
          exit $rc

      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}

      - name: Test
        run: ctest --test-dir out/build/${{ matrix.preset }} -C Release --output-on-failure

      - name: Package
        if: matrix.package
        run: cpack --preset ${{ matrix.build_preset }}

      - name: Upload package
        if: matrix.package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/build/${{ matrix.preset }}/ffs2play_*.exe
            out/build/${{ matrix.preset }}/ffs2play_*.dmg
          if-no-files-found: error

  # Native packages, built in a container of each distribution against its own Qt (>= 6.8).
  # Asset names are read by the portal (suite contract update-api.md) : keep build-package.sh naming.
  linux-packages:
    name: Linux package ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: debian-13,           image: 'debian:trixie' }
          - { distro: ubuntu-26.04,        image: 'ubuntu:26.04' }
          - { distro: fedora-43,           image: 'fedora:43' }
          - { distro: fedora-44,           image: 'fedora:44' }
          - { distro: opensuse-tumbleweed, image: 'opensuse/tumbleweed:latest' }
          - { distro: arch,                image: 'archlinux:latest' }
    steps:
      # without git, actions/checkout downloads an archive : no tags, no version
      - name: Install git
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y git ca-certificates
          elif command -v dnf >/dev/null; then dnf install -y git
          # the image ships busybox-gawk, which conflicts with the gawk required by rpm-build
          elif command -v zypper >/dev/null; then zypper --non-interactive install --force-resolution git tar gzip gawk
          elif command -v pacman >/dev/null; then pacman -Syu --noconfirm git
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # tags give the application version

      - name: Build dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/linux/build-package.sh --install-deps --deps-only

      # the unit tests run in the Linux job above
      - name: Package
        run: |
          if command -v makepkg >/dev/null; then
            # makepkg refuses to run as root
            useradd -m builder
            chown -R builder "$GITHUB_WORKSPACE"
            su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE' && packaging/linux/build-package.sh --no-tests --output out/packages"
          else
            packaging/linux/build-package.sh --no-tests --output out/packages
          fi
          ls -l out/packages

      - uses: actions/upload-artifact@v5
        with:
          name: release-linux-${{ matrix.distro }}
          path: out/packages/ffs2play*
          if-no-files-found: error

  # One AppImage for every distribution : built on the oldest supported Ubuntu for a wide glibc compatibility
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtgrpc qtwaylandcompositor
          cache: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libwayland-cursor0 libwayland-egl1

      # on failure, the end of the log goes to an annotation (readable without signing in)
      - name: AppImage
        run: |
          set +e
          packaging/linux/build-appimage.sh --output out/packages 2>&1 | tee appimage.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error title=AppImage::$(tail -n 40 appimage.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit $rc

      - uses: actions/upload-artifact@v5
        with:
          name: release-appimage
          path: out/packages/*.AppImage
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, linux-packages, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: packages
          pattern: release-*
          merge-multiple: true

      # Tags are numeric (version read by CMake) : a beta is an annotated tag whose message contains [beta]
      # (git tag -a 2.6.0 -m "[beta] ..."). The portal offers a prerelease to beta clients only.
      - name: Channel
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
          message=""
          if [ -n "$sha" ]; then
            message=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message)
          fi
          if grep -q -i '\[beta\]' <<< "$message"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # published at once : the portal offers it to the clients within 10 minutes (suite contract update-api.md)
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generate_release_notes: true
