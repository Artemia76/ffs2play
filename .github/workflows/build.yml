name: Build

on:
  push:
    branches: [ master, devel ]
    tags: [ '*.*.*' ]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-2022
            preset: windows-msvc
            build_preset: windows-msvc-release
            package: true
          - name: Linux
            os: ubuntu-24.04
            preset: linux-release
            build_preset: linux-release
            package: false
          - name: macOS
            os: macos-14
            preset: macos-release
            build_preset: macos-release
            package: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # tags give the application version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtgrpc         # Qt Protobuf
          cache: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libgl1-mesa-dev libxkbcommon-dev

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        env:
          QTDIR: ${{ env.QT_ROOT_DIR }}
        run: cmake --preset ${{ matrix.preset }} -DFFS2PLAY_WITH_SIMCONNECT=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}

      - name: Test
        run: ctest --test-dir out/build/${{ matrix.preset }} -C Release --output-on-failure

      - name: Package
        if: matrix.package
        run: cpack --preset ${{ matrix.build_preset }}

      - name: Upload package
        if: matrix.package
        uses: actions/upload-artifact@v5
        with:
          name: ffs2play-${{ runner.os }}
          path: |
            out/build/${{ matrix.preset }}/ffs2play_*.exe
            out/build/${{ matrix.preset }}/ffs2play_*.dmg
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          draft: true
          generate_release_notes: true
