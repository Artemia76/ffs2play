syntax = "proto3";

// Field numbers are part of the wire format shared with the X-Plane plugin
// (xffs2play) : never renumber an existing field, only add new ones.

message StringArray {
        repeated string values = 1;
}

message AirData {
        int64           timestamp = 1;
        string          title = 2;
        string          model = 3;
        string          type = 4;
        string          air_line = 46;
        string          category = 5;
        double          altitude = 6;
        double          ground_altitude = 7;
        double          heading = 8;
        double          longitude = 9;
        double          latitude = 10;
        double          ias_speed = 11;
        double          pitch = 12;
        double          bank = 13;
        int32           squawk = 14;
        double          elevator_pos = 15;
        double          aileron_pos = 16;
        double          rudder_pos = 17;
        double          spoiler_pos = 47;
        int32           door1_pos = 18;
        int32           door2_pos = 19;
        int32           door3_pos = 20;
        int32           door4_pos = 21;
        int32           flaps_index = 22;
        int32           num_engine = 23;
        int32           throttle_eng1 = 24;
        int32           throttle_eng2 = 25;
        int32           throttle_eng3 = 26;
        int32           throttle_eng4 = 27;
        bool            on_ground = 28;
        bool            gear_pos = 29;
        bool            landing_light = 30;
        bool            beacon_light = 31;
        bool            strobe_light = 32;
        bool            nav_light = 33;
        bool            reco_light = 34;
        bool            taxi_light = 45;
        bool            state_eng1 = 35;
        bool            state_eng2 = 36;
        bool            state_eng3 = 37;
        bool            state_eng4 = 38;
        bool            smoke = 39;
        double          tas_speed = 40;
        double          gnd_speed = 41;
        bool            parking_brake = 42;
        double          v_speed = 43;
        int32           squawk_mode = 44;
}

message AIResol {
        string          title = 1;
        string          path = 2;
        string          model = 5;
        string          air_line = 6;
        double          cg_height = 3;
        double          pitch = 4;
}
